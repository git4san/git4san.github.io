name: Update Google Scholar Publications

on:
  workflow_dispatch:

  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Scholar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scholar.txt

      - name: Fetch latest Google Scholar data
        run: |
          python scripts/update_scholar.py

      - name: Commit updated publications
        run: |
          git config user.name "scholar-updater"
          git config user.email "scholar-updater@users.noreply.github.com"

          git add client/src/data/publications.json

          if git diff --cached --quiet; then
            echo "No Scholar changes detected."
          else
            git commit -m "Update Google Scholar publications"
            git push
          fi
